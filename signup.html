<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <h1 class="sut">Create a new account</h1>
            <p class="sup">Fill in the information below to get started.</p>
            <div class="stop">
            <div class="inputs">
            <label for="" >Full Name</label>
            <input type="Name" placeholder="Enter your full name">
            <label for="">Email Address</label>
            <input type="Email" placeholder="Email">
            <label for="">Password</label>
            <input type="password" placeholder="Create a password">
            <label for="">Confirm Password</label>
            <input type="password" placeholder="Confirm your password">
            </div>
            <div class="signupimage">
                <img class="sim" src="./Images/Signing Up Process Chalkboard.png" alt="">
            </div>
            <a href="index.html"><button class="sb">Submit</button></a>
            </div>
        </section>
    </main>
</body>
</html>
